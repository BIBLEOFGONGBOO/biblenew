<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Bible New</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }

    .app {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px;
    }

    .home {
      text-align: center;
      margin-top: 60px;
    }

    .home h1 {
      font-size: 32px;
      margin-bottom: 28px;
    }

    .study-btn {
      width: 220px;
      margin: 8px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    #buildNumber {
      position: fixed;
      left: 6px;
      top: 6px;
      font-size: 11px;
      font-weight: 700;
      background: #fff59d;
      padding: 3px 6px;
      border-radius: 4px;
    }

    #content {
      margin-top: 24px;
    }
  </style>
</head>

<body>

  <div id="buildNumber"></div>

  <main class="app">

    <section id="home" class="home">
      <h1>BIBLE</h1>

      <button
        class="study-btn"
        onclick="loadBibleSample('OT')"
      >
        Old Testament
      </button>

      <button
        class="study-btn"
        onclick="loadBibleSample('NT')"
      >
        New Testament
      </button>
    </section>


    <div
  id="bibleHeaderActionRow"
  style="
    display:flex;
    justify-content:center;
    margin:10px 0;
  "
></div>
    
    <section id="content"></section>

  </main>

  <script src="./config.js"></script>
  <script src="./bible-main.js"></script>

</body>
</html>
