<!-- SUBBLOCK 0000 : DOCUMENT / HEAD -->

<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    GONGBOO BIBLE
  </title>

  <link
    rel="stylesheet"
    href="./gongboo-ui.css"
  />

  <link
    rel="stylesheet"
    href="./bible-original.css"
  />

</head>


<body>

<div class="gb-app">

  <header class="gb-topbar">

    <div class="gb-topbar-row">

      <div class="gb-toolbar">


        <!-- SUBBLOCK 0500 : SYSTEM -->

        <div class="gb-card-wrap">

          <button
            id="systemButton"
            class="gb-tool-button gb-system-button"
            type="button"
            aria-expanded="false"
          >
            BIB
            <span class="gb-chevron">▼</span>
          </button>


          <div
            id="systemCard"
            class="gb-card gb-system-card"
            hidden
          >

            <div class="gb-card-title">
              SYSTEM
            </div>


            <button
              class="gb-system-option"
              type="button"
            >
              <span class="gb-system-code">
                CON
              </span>

              <span class="gb-system-name">
                CONVERSATION
              </span>
            </button>


            <button
              class="gb-system-option is-active"
              type="button"
            >
              <span class="gb-system-code">
                BIB
              </span>

              <span class="gb-system-name">
                BIBLE
              </span>
            </button>


            <button
              class="gb-system-option"
              type="button"
            >
              <span class="gb-system-code">
                EAS
              </span>

              <span class="gb-system-name">
                EASY LEARNING
              </span>
            </button>


            <button
              class="gb-system-option"
              type="button"
            >
              <span class="gb-system-code">
                LIC
              </span>

              <span class="gb-system-name">
                LICENSE
              </span>
            </button>

          </div>

        </div>


        <!-- SUBBLOCK 1000 : PSG -->
        <button
          id="psgButton"
          class="gb-tool-button"
          type="button"
          aria-pressed="false"
        >
          PSG
        </button>


        <!-- SUBBLOCK 1500 : LANGUAGE -->

<div class="gb-card-wrap">

  <button
    id="langButton"
    class="gb-tool-button"
    type="button"
    aria-expanded="false"
  >
    LANG
  </button>


  <div
    id="langCard"
    class="gb-card"
    hidden
  >

    <div class="gb-card-title">
      LANGUAGE
    </div>


    <div class="gb-card-row">

      <span class="gb-card-label">
        PRIMARY
      </span>

      <select
        id="biblePrimaryTextSelector"
        class="gb-select"
        aria-label="Primary Bible language"
      >

        <option value="WEB">
          ENG
        </option>

        <option value="KJV">
          KJV
        </option>

        <option value="KO_WEB">
          KOR
        </option>

      </select>

    </div>


    <div class="gb-card-row">

      <span class="gb-card-label">
        SECONDARY
      </span>

      <select
        id="bibleSecondaryTextSelector"
        class="gb-select"
        aria-label="Secondary Bible language"
      >

        <option value="NONE">
          NONE
        </option>

        <option value="WEB">
          ENG
        </option>

        <option value="KJV">
          KJV
        </option>

        <option value="KO_WEB">
          KOR
        </option>

      </select>

    </div>

  </div>

</div>


        <!-- SUBBLOCK 2000 : PLAY -->
        <div class="gb-card-wrap">

          <button
            id="playButton"
            class="gb-tool-button"
            type="button"
            aria-expanded="false"
          >
            PLAY
          </button>

          <div
            id="playCard"
            class="gb-card"
            hidden
          >
            <div class="gb-card-title">
              PLAY
            </div>

            <div class="gb-slider-row">

              <span class="gb-slider-label">
                SPEED
              </span>

              <input
                id="speedRange"
                class="gb-range"
                type="range"
                min="0.25"
                max="2"
                step="0.05"
                value="1"
              />

              <span
                id="speedValue"
                class="gb-slider-value"
              >
                1.00×
              </span>

            </div>

            <div class="gb-four-actions">

              <button
                id="repeatToggle"
                class="gb-compact-toggle"
                type="button"
                aria-pressed="false"
              >
                REPEAT
              </button>

              <button
                id="playAutoToggle"
                class="gb-compact-toggle"
                type="button"
                aria-pressed="false"
              >
                AUTO
              </button>

              <button
                id="playStartButton"
                class="gb-compact-action"
                type="button"
                aria-pressed="false"
              >
                ▶ START
              </button>

              <button
                id="playStopButton"
                class="gb-compact-action"
                type="button"
                aria-pressed="false"
              >
                ■ STOP
              </button>

            </div>
          </div>
        </div>


        <!-- SUBBLOCK 2500 : MIC -->
        <div class="gb-card-wrap">

          <button
            id="micButton"
            class="gb-tool-button"
            type="button"
            aria-expanded="false"
          >
            MIC
          </button>

          <div
            id="micCard"
            class="gb-card"
            hidden
          >
            <div class="gb-card-title">
              MIC
            </div>

            <div class="gb-slider-row">

              <span class="gb-slider-label">
                PASS
              </span>

              <input
                id="passRange"
                class="gb-range"
                type="range"
                min="50"
                max="100"
                step="1"
                value="70"
              />

              <span
                id="passValue"
                class="gb-slider-value"
              >
                70%
              </span>

            </div>

            <div class="gb-slider-row">

              <span class="gb-slider-label">
                DELAY
              </span>

              <input
                id="delayRange"
                class="gb-range"
                type="range"
                min="0"
                max="5"
                step="0.1"
                value="2"
              />

              <span
                id="delayValue"
                class="gb-slider-value"
              >
                2.0s
              </span>

            </div>

            <div class="gb-three-actions">

              <button
                id="micAutoToggle"
                class="gb-compact-toggle"
                type="button"
                aria-pressed="false"
              >
                AUTO
              </button>

              <button
                id="micStartButton"
                class="gb-compact-action"
                type="button"
                aria-pressed="false"
              >
                ▶ START
              </button>

              <button
                id="micStopButton"
                class="gb-compact-action"
                type="button"
                aria-pressed="false"
              >
                ■ STOP
              </button>

            </div>
          </div>
        </div>


        <!-- SUBBLOCK 3000 : MORE / MODE -->
        <div class="gb-card-wrap">

          <button
            id="moreButton"
            class="gb-tool-button gb-tool-button-square"
            type="button"
            aria-expanded="false"
          >
            ⋯
          </button>

          <div
            id="moreCard"
            class="gb-card"
            hidden
          >
            <div class="gb-card-title">
              MODE
            </div>

            <div class="gb-mode-row">

  <button
    id="modeLearnButton"
    class="gb-mode-button"
    type="button"
    data-ui-mode="learn"
  >
    LRN
  </button>

  <button
    id="modeStudyButton"
    class="gb-mode-button is-active"
    type="button"
    data-ui-mode="study"
  >
    STD
  </button>

  <button
    id="modeExamButton"
    class="gb-mode-button"
    type="button"
    data-ui-mode="exam"
  >
    EXM
  </button>

</div>

            <div class="gb-card-separator"></div>

            <div class="gb-more-grid">

              <button
                id="chunkToggle"
                class="gb-more-grid-button"
                type="button"
                aria-pressed="false"
              >
                CHUNK
              </button>

              <button
                id="peopleButton"
                class="gb-more-grid-button"
                type="button"
                disabled
              >
                PEOPLE
              </button>

              <button
                id="mapButton"
                class="gb-more-grid-button"
                type="button"
                disabled
              >
                MAP
              </button>

              <button
                class="gb-more-grid-button"
                type="button"
                disabled
              >
                OPTION
              </button>

              <button
                class="gb-more-grid-button"
                type="button"
                disabled
              >
                OPTION
              </button>

              <button
                class="gb-more-grid-button"
                type="button"
                disabled
              >
                OPTION
              </button>

            </div>

            <div class="gb-card-separator"></div>

            <button
              class="gb-login-button"
              type="button"
              disabled
            >
              LOGIN
            </button>

          </div>
        </div>

      </div>
    </div>
  </header>


<!-- SUBBLOCK 3500 : CONTENT / CONVERSATION HOST -->

<!-- SUBBLOCK 3500 : BIBLE CONTENT HOST -->

<main class="gb-content">

  <!-- ===================================================== -->
  <!-- BIBLE HOME / NEW LESSON -->
  <!-- ===================================================== -->

  <section
    id="setupSection"
    class="gb-demo-card"
  >

    <div class="card card-new">

      <div
        id="resumeQuickContainer"
        class="resume-quick"
        hidden
      ></div>


      <div class="card-icon">
        📖
      </div>


      <div
        class="card-title card-title-new"
      >
        NEW LESSON
      </div>


      <div class="card-sub">
        Choose a book, then choose a chapter
      </div>


      <div
        id="bibleChapterPicker"
        class="bible-chapter-picker"
        aria-label="Bible chapters"
        aria-live="polite"
        hidden
      ></div>


      <div
        id="bibleBookPicker"
        class="bible-book-picker"
        aria-label="Bible books"
      ></div>


      <div
        class="input-wrapper bible-legacy-chapter-select"
        hidden
      >

        <select
          id="setSelector"
        >
          <option value="1">
            Loading sets...
          </option>
        </select>

      </div>


      <div
        class="input-wrapper"
        hidden
      >

        <input
          type="number"
          id="startNumber"
          min="1"
          placeholder="1-720"
        >

      </div>


      <button
        class="btn-start"
        id="startQuizBtn"
        hidden
      >
        ▶ START
      </button>


      <div class="card-hint">
        Select one of the 66 books.
      </div>

    </div>


    <div
      class="card card-resume"
      id="resumeCard"
      hidden
    >

      <div class="card-icon">
        ⏳
      </div>

      <div class="card-title card-title-resume">
        RESUME
      </div>

      <div class="card-sub card-sub-resume">
        Continue previous session
      </div>

      <div id="savedBadgeContainer">

        <div class="no-session">
          No saved session
          <small>
            Start a new lesson
          </small>
        </div>

      </div>

    </div>


    <div class="bottom-hint">
      Progress is saved automatically
    </div>

  </section>


  <!-- ===================================================== -->
  <!-- BIBLE LESSON -->
  <!-- ===================================================== -->

  <section
    id="quizMain"
    class="gb-demo-card"
    style="display:none;"
  >

    <div
      id="reviewBanner"
      class="review-banner"
      style="display:none;"
    >
      <span>Review Mode</span>

      <button
        id="exitReviewBtn"
        class="exit-review-btn"
      >
        EXIT REVIEW
      </button>
    </div>


    <div
      class="progress-area"
      style="display:none;"
    >

      <div class="progress-bar-container">

        <div
          class="progress-bar"
          id="quizProgressBar"
        ></div>

      </div>


      <div
        class="account-identity"
        id="accountIdentity"
      ></div>

    </div>


    <div
      id="quizContent"
      style="display:none;"
    >

      <div
        id="questionContainer"
      ></div>


      <div
        id="explanationBox"
        class="explanation"
      >

        <div
          id="explanationText"
        ></div>

      </div>


      <!-- 기존 MAIN 호환용 NAV -->
      <div hidden>

        <button
          id="prevBtn"
          type="button"
        ></button>

        <button
          id="skipBtn"
          type="button"
        ></button>

        <button
          id="nextBtn"
          type="button"
        ></button>

        <button
          id="submitBtn"
          type="button"
        ></button>

        <button
          id="quitBtn"
          type="button"
        ></button>

      </div>

    </div>

  </section>

</main>


<!-- SUBBLOCK 4000 : PREV / NEXT -->
  <footer class="gb-bottom-nav">

    <button
      id="prevButton"
      class="gb-nav-button"
      type="button"
    >
      ◀ PREV
    </button>

    <button
      id="nextButton"
      class="gb-nav-button"
      type="button"
    >
      NEXT ▶
    </button>

  </footer>

</div>

<!-- SUBBLOCK 4250 : LEGACY MAIN COMPATIBILITY -->

<div hidden>

  <button
    id="bibleExploreToggle"
    type="button"
  ></button>

  <button
    id="biblePeopleToggle"
    type="button"
  ></button>

  <button
    id="biblePassageToggle"
    type="button"
    aria-pressed="false"
  ></button>

  <button
    id="bibleQuizToggle"
    type="button"
    aria-pressed="true"
  ></button>

  <div
    id="bibleHeaderActionRow"
  ></div>

</div>
  
<!-- SUBBLOCK 4500 : SCRIPT LOAD / PAGE CLOSE -->

<script src="./config.js"></script>
<script src="./supabase-config.js"></script>
<script src="./supabase-provider.js"></script>

<script src="./gongboo-ui.js"></script>

<script
  type="module"
  src="./bible-explorer.js"
></script>

<script
  type="module"
  src="./bible-main.js"
></script>

</body>
</html>
